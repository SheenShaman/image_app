[project]
name = "image-app"
version = "0.1.0"
description = ""
authors = [
    { name = "3D.tech" }
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "pyqt5 (==5.15.9)",
    "pyqt5-tools (==5.15.9.3.3)",
    "pillow (>=12.1.0,<13.0.0)",
    "ruff (>=0.14.14,<0.15.0)",
    "pyinstaller (>=6.18.0,<7.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 80
exclude = ["venv", ".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "C", "B", "I"]
ignore = ["E203"]
